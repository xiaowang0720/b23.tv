# For more information on configuration, see:
#   * Official English Documentation: http://nginx.org/en/docs/
#   * Official Russian Documentation: http://nginx.org/ru/docs/

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

# Load dynamic modules. See /usr/share/doc/nginx/README.dynamic.
include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 2048;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    # 后台访问限流：抵挡脚本暴力请求，同时不影响人工操作
    limit_req_zone $binary_remote_addr zone=adminlim:10m rate=20r/m;

    include /etc/nginx/conf.d/*.conf;

    server {
        listen       80 default_server;
        listen       [::]:80 default_server;
        server_name  _;
        root         /var/www/html;

        location / {
        }

        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
    }

    server {
        server_name yuyubi.cfd;
        root /var/www/html;

        # ---------- 后台管理 ----------
        location = /admin.php {
            limit_req zone=adminlim burst=40 nodelay;
            fastcgi_pass unix:/run/php-fpm/www.sock;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/admin.php;
        }
        location = /admin {
            return 301 https://$host/admin/;
        }
        location = /admin/ {
            limit_req zone=adminlim burst=40 nodelay;
            fastcgi_pass unix:/run/php-fpm/www.sock;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/admin.php;
        }

        # ---------- 链接路由：任意路径第一段即短链 ----------
        location = /page.php {
            return 404;
        }
        location / {
            try_files $uri $uri/ @page;
        }
        location @page {
            fastcgi_pass unix:/run/php-fpm/www.sock;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/page.php;
        }

        # ---------- 静态资源 ----------
        location /assets/ {
            add_header Cache-Control "public, max-age=86400";
            add_header X-Content-Type-Options nosniff;
        }

        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;

        listen [::]:443 ssl ipv6only=on; # managed by Certbot
        listen 443 ssl; # managed by Certbot
        ssl_certificate /etc/letsencrypt/live/yuyubi.cfd/fullchain.pem; # managed by Certbot
        ssl_certificate_key /etc/letsencrypt/live/yuyubi.cfd/privkey.pem; # managed by Certbot
        include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
    }

    server {
        if ($host = yuyubi.cfd) {
            return 301 https://$host$request_uri;
        } # managed by Certbot

        listen       80 ;
        listen       [::]:80 ;
        server_name yuyubi.cfd;
        return 404; # managed by Certbot
    }
}
