; Site hardening
cgi.fix_pathinfo = 0
expose_php = Off
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_NOTICE

disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,curl_exec,curl_multi_exec,show_source,highlight_file

session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_secure = 1

upload_max_filesize = 2M
post_max_size = 8M
max_execution_time = 30